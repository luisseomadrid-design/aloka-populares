<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos populares de Aloka</title>
  <style>
    body{
      font-family: Arial, sans-serif;
      background:#f5f5f5;
      margin:0;
      padding:30px;
    }
    h1{
      text-align:center;
      margin-bottom:30px;
    }
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:20px;
      max-width:1100px;
      margin:0 auto;
    }
    .card{
      background:#fff;
      border-radius:12px;
      overflow:hidden;
      box-shadow:0 4px 14px rgba(0,0,0,.08);
    }
    .card img{
      width:100%;
      height:220px;
      object-fit:cover;
      display:block;
      background:#ddd;
    }
    .card h3{
      padding:14px;
      margin:0;
      font-size:16px;
      line-height:1.4;
    }
  </style>
</head>
<body>
  <h1>Productos populares de Aloka</h1>
  <div class="grid" id="grid"></div>

  <script>
    fetch('./productos-populares.json')
      .then(r => r.json())
      .then(productos => {
        const grid = document.getElementById('grid');
        grid.innerHTML = productos.map(p => `
          <div class="card">
            <img src="${p.imagen}" alt="${p.nombre}">
            <h3>${p.nombre}</h3>
          </div>
        `).join('');
      })
      .catch(() => {
        document.getElementById('grid').innerHTML = '<p>No se pudieron cargar los productos.</p>';
      });
  </script>
</body>
</html>
