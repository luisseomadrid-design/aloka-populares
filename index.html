<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos populares de Aloka</title>
  <style>
    body{
      font-family: Arial, sans-serif;
      background:#f5f5f5;
      margin:0;
      padding:30px;
    }
    h1{
      text-align:center;
      margin-bottom:30px;
    }
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:20px;
      max-width:1100px;
      margin:0 auto;
    }
    .card{
      background:#fff;
      border-radius:12px;
      overflow:hidden;
      box-shadow:0 4px 14px rgba(0,0,0,.08);
    }
    .card img{
      width:100%;
      height:220px;
      object-fit:cover;
      display:block;
      background:#ddd;
    }
    .card h3{
      padding:14px;
      margin:0;
      font-size:16px;
      line-height:1.4;
    }
    .msg{
      max-width:900px;
      margin:20px auto;
      background:#fff3cd;
      color:#7a5b00;
      border:1px solid #ffe69c;
      padding:14px;
      border-radius:10px;
    }
  </style>
</head>
<body>
  <h1>Productos populares de Aloka</h1>
  <div id="msg" class="msg">Cargando productos...</div>
  <div class="grid" id="grid"></div>

  <script>
    fetch('./productos-populares.json')
      .then(response => {
        if (!response.ok) {
          throw new Error('No se encontró productos-populares.json');
        }
        return response.json();
      })
      .then(productos => {
        const msg = document.getElementById('msg');
        const grid = document.getElementById('grid');

        if (!Array.isArray(productos) || productos.length === 0) {
          msg.textContent = 'El JSON está vacío.';
          return;
        }

        msg.style.display = 'none';

        grid.innerHTML = productos.map(p => `
          <div class="card">
            <img src="${p.imagen}" alt="${p.nombre}" onerror="this.src='https://placehold.co/600x400/png?text=Sin+imagen'">
            <h3>${p.nombre}</h3>
          </div>
        `).join('');
      })
      .catch(error => {
        document.getElementById('msg').textContent = 'Error: ' + error.message;
      });
  </script>
</body>
</html>
